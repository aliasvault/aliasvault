version: 2
updates:
    # Enable version updates for NuGet
    - package-ecosystem: "nuget"
      directory: "/apps/server"
      target-branch: "main"
      open-pull-requests-limit: 10
      labels:
          - "dependencies"
      schedule:
          day: "monday"
          time: "09:00"
          interval: "weekly"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
      groups:
          nuget-minor-patch:
              update-types:
                  - "minor"
                  - "patch"

    # Enable version updates for npm
    - package-ecosystem: "npm"
      directories:
          - "/apps/browser-extension"
          - "/apps/mobile-app"
          - "/apps/server/AliasVault.Admin"
          - "/apps/web"
          - "/core/client"
          - "/core/i18n"
          - "/core/models"
          - "/core/vault"
          - "/docs"
      open-pull-requests-limit: 0
      schedule:
          day: "monday"
          time: "09:00"
          interval: "weekly"
      ignore:
          # eslint 10 is unusable here: eslint-plugin-import peers on `<=9` and has no
          # v10-compatible release. Drop this once eslint-plugin-import supports v10.
          - dependency-name: "eslint"
            versions: [">=10"]

    # Security updates for the Rust core
    - package-ecosystem: "cargo"
      directory: "/core/rust"
      open-pull-requests-limit: 0
      schedule:
          day: "monday"
          time: "09:00"
          interval: "weekly"

    # Security updates for the Android native module.
    - package-ecosystem: "gradle"
      directory: "/apps/mobile-app/android"
      open-pull-requests-limit: 0
      schedule:
          day: "monday"
          time: "09:00"
          interval: "weekly"
      ignore:
          # AGP must move together with Gradle, Kotlin and the RN Gradle plugin; bump it deliberately.
          - dependency-name: "com.android.tools.build:gradle"
            update-types: ["version-update:semver-major", "version-update:semver-minor"]

    # Enable version updates for Docker base images
    - package-ecosystem: "docker"
      directories:
          - "/apps/server"
          - "/apps/server/AliasVault.Admin"
          - "/apps/server/AliasVault.Api"
          - "/apps/server/AliasVault.SmtpService"
          - "/apps/server/AliasVault.TaskRunner"
          - "/apps/server/Databases/AliasServerDb"
          - "/apps/server/Utilities/AliasVault.InstallCli"
          - "/apps/web"
          - "/dockerfiles/all-in-one"
          - "/docs"
      schedule:
          day: "monday"
          time: "09:00"
          interval: "weekly"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
      groups:
          docker-images:
              patterns:
                  - "*"

    # Enable version updates for GitHub Actions
    - package-ecosystem: "github-actions"
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          day: "monday"
          time: "09:00"
          interval: "weekly"
      groups:
          github-actions:
              patterns:
                  - "*"
