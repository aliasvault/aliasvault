# Browser Extension E2E tests
name: E2E Tests - Browser Extension

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/browser-extension/**'
      - 'core/**'
      - '.github/workflows/e2e-tests-browser-extension.yml'
      - '.github/actions/start-api-server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/browser-extension/**'
      - 'core/**'
      - '.github/workflows/e2e-tests-browser-extension.yml'
      - '.github/actions/start-api-server/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-extension-dotnet-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install clang (compiles SQLite for wasm32)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build core libraries
        run: |
          cd ./core
          chmod +x build-and-distribute.sh
          ./build-and-distribute.sh --browser-extension

      - name: Install .NET dependencies
        working-directory: apps/server
        run: dotnet workload install wasm-tools

      - name: Build server
        working-directory: apps/server
        run: dotnet build

      - name: Build browser extension
        working-directory: apps/browser-extension
        run: |
          npm install
          npm run build:chrome

      - name: Start dev database
        run: ./scripts/dev.sh db-start

      - name: Ensure browsers are installed
        working-directory: apps/server
        run: pwsh Tests/AliasVault.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run ExtensionTests with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          command: cd apps/server && dotnet test Tests/AliasVault.E2ETests --no-build --verbosity normal --filter "Category=ExtensionTests"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-dotnet-test-results
          path: TestResults-Extension.xml

  browser-extension-playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/browser-extension/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install clang (compiles SQLite for wasm32)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build core libraries
        run: |
          cd ./core
          chmod +x build-and-distribute.sh
          ./build-and-distribute.sh --browser-extension

      - name: Start dev database
        run: ./scripts/dev.sh db-start

      - name: Start API server
        uses: ./.github/actions/start-api-server
        with:
          database: aliasdb_e2e_extension

      - name: Install browser extension dependencies
        run: npm ci
        working-directory: apps/browser-extension

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/browser-extension
        timeout-minutes: 10

      - name: Build and run E2E tests with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          command: cd apps/browser-extension && npm run test:e2e:build
        env:
          ALIASVAULT_API_URL: "http://localhost:5100"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-playwright-report
          path: apps/browser-extension/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-playwright-test-results
          path: apps/browser-extension/tests/test-results/
          retention-days: 30

      - name: Upload API server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-api-server-log
          path: /tmp/api-server.log
          retention-days: 30
          if-no-files-found: ignore
