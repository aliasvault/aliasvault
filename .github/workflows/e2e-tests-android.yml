# Android native E2E tests
name: E2E Tests - Android

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/mobile-app/**'
      - 'core/**'
      - '.github/workflows/e2e-tests-android.yml'
      - '.github/actions/build-core-libraries/**'
      - '.github/actions/start-api-server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/mobile-app/**'
      - 'core/**'
      - '.github/workflows/e2e-tests-android.yml'
      - '.github/actions/build-core-libraries/**'
      - '.github/actions/start-api-server/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e-tests:
    if: false  # Temporarily disabled - will re-test in separate PR
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false  # Keep Android SDK
          dotnet: false   # Keep .NET (we need it)
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Build core libraries
        uses: ./.github/actions/build-core-libraries
        with:
          target: android

      - name: Install mobile app dependencies
        run: npm ci

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser -s aliasvault || true
          sudo -u postgres psql -c "ALTER USER aliasvault WITH PASSWORD 'password';" || true
          sudo -u postgres createdb -O aliasvault aliasdb_e2e_android || true

      - name: Start API server
        uses: ./.github/actions/start-api-server
        with:
          database: aliasdb_e2e_android
          db-port: "5432"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-x86_64-${{ runner.os }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Start Metro bundler
        run: |
          # Start Metro bundler in background (non-interactive mode for CI)
          npx expo start --offline > /tmp/metro.log 2>&1 &
          METRO_PID=$!
          echo $METRO_PID > /tmp/metro.pid

          # Wait for Metro to be ready
          echo "Waiting for Metro bundler to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              echo "Metro bundler is ready!"
              break
            fi
            echo "Attempt $i: Metro not ready yet..."
            # Show recent log for debugging
            tail -3 /tmp/metro.log 2>/dev/null || true
            sleep 2
          done

      - name: Build and Run Android E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile-app/android
          script: |
            # Wait for emulator to be fully booted
            adb wait-for-device
            adb shell input keyevent 82  # Unlock screen

            # Set up port forwarding so emulator can reach host's API server and Metro bundler
            adb reverse tcp:5100 tcp:5100  # API server
            adb reverse tcp:8081 tcp:8081  # Metro bundler

            # Build and install the debug APK
            ./gradlew :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # Run the instrumented tests
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.API_URL=http://10.0.2.2:5100 --stacktrace
        env:
          API_URL: "http://10.0.2.2:5100"
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-test-results
          path: apps/mobile-app/android/app/build/reports/androidTests/
          retention-days: 14

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-test-outputs
          path: apps/mobile-app/android/app/build/outputs/androidTest-results/
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-test-logs
          path: |
            /tmp/api-server.log
            /tmp/metro.log
          retention-days: 14
          if-no-files-found: ignore
