<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="twofa-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="2" width="16" height="20" rx="2" ry="2" fill="url(#twofa-gradient)" stroke="#4338ca" stroke-width="0.5"/>

  <!-- File fold -->
  <path d="M16 2v4h4" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2FA text -->
  <text x="12" y="10" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="3" font-weight="bold">2FA</text>

  <!-- One otpauth:// URL per line -->
  <g fill="white">
    <circle cx="7" cy="13" r="0.5"/>
    <circle cx="7" cy="15.5" r="0.5"/>
    <circle cx="7" cy="18" r="0.5"/>
  </g>
  <g stroke="white" stroke-width="0.8" stroke-linecap="round">
    <line x1="8.5" y1="13" x2="17" y2="13"/>
    <line x1="8.5" y1="15.5" x2="15.5" y2="15.5"/>
    <line x1="8.5" y1="18" x2="16.5" y2="18"/>
  </g>
</svg>
