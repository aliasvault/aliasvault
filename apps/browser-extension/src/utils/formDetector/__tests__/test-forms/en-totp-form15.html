<!DOCTYPE html>
<html lang="en">

<head>
  <title>Verify your identity</title>
</head>

<body>
  <div class="ui segment">
    <h3 class="ui header text-center">
      Verify your identity
    </h3>

    <input id="username" type="hidden" value="user@example.com">

    <div class="segment-form">
      <form action="https://login.example.com/commonauth" method="post" id="totpForm" class="ui large form otp-form">
        <p class="text-center" id="instruction">Enter the verification code generated by your authenticator app.</p>
        <div class="field">
          <input hidden="" type="text" id="token" name="token" class="form-control" placeholder="Verification code">
        </div>

        <div class="equal width fields">
          <div class="field mt-5">
            <input class="text-center p-3" id="pincode-1" name="pincode-1" tabindex="1" placeholder="·" maxlength="1" onkeyup="movetoNext(this, 'pincode-2', null)" autocomplete="off" autofocus="">
          </div>
          <div class="field mt-5">
            <input class="text-center p-3" id="pincode-2" name="pincode-2" tabindex="2" placeholder="·" maxlength="1" onkeyup="movetoNext(this, 'pincode-3', 'pincode-1')" autocomplete="off">
          </div>
          <div class="field mt-5">
            <input class="text-center p-3" id="pincode-3" name="pincode-3" tabindex="3" placeholder="·" maxlength="1" onkeyup="movetoNext(this, 'pincode-4', 'pincode-2')" autocomplete="off">
          </div>
          <div class="field mt-5">
            <input class="text-center p-3" id="pincode-4" name="pincode-4" tabindex="4" placeholder="·" maxlength="1" onkeyup="movetoNext(this, 'pincode-5', 'pincode-3')" autocomplete="off">
          </div>
          <div class="field mt-5">
            <input class="text-center p-3" id="pincode-5" name="pincode-5" tabindex="5" placeholder="·" maxlength="1" onkeyup="movetoNext(this, 'pincode-6', 'pincode-4')" autocomplete="off">
          </div>
          <div class="field mt-5">
            <input class="text-center p-3" id="pincode-6" name="pincode-6" tabindex="6" placeholder="·" maxlength="1" onkeyup="movetoNext(this, null, 'pincode-5')" autocomplete="off">
          </div>
        </div>

        <input id="sessionDataKey" type="hidden" name="sessionDataKey" value="00000000-0000-0000-0000-000000000000">
        <div class="ui divider hidden"></div>

        <input id="multiOptionURI" type="hidden" name="multiOptionURI" value="null">
        <div class="ui divider hidden"></div>
        <div>
          <input type="submit" id="subButton" onclick="sub(); return false;" value="Continue" class="ui primary fluid large button" disabled="disabled">
        </div>
      </form>
    </div>

    <div class="ui" id="enrol-msg">Haven't setup your TOTP authenticator yet? <a href="mailto:support@example.com">Contact support</a></div>
  </div>
</body>

</html>
